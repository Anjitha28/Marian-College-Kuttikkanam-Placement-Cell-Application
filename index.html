<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Marian College Kuttikkanam Placement Cell</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=5">
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash-screen" style="position: fixed; inset: 0; background: #0B1F3A; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; transition: opacity 0.3s ease;">
        <img src="LogoIcon.png" alt="Marian College Logo" style="height: 90px; margin-bottom: 1.5rem; object-fit: contain;">
        <h1 style="font-size: 1.5rem; font-weight: 800; color: #FFFFFF; margin-bottom: 0.5rem; text-align: center;">MARIAN COLLEGE KUTTIKKANAM</h1>
        <p style="color: #A00000; font-weight: 700; letter-spacing: 1px; font-size: 0.85rem; text-transform: uppercase;">Autonomous · Placement Cell</p>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(function() {
                var splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.style.opacity = '0';
                    setTimeout(function() {
                        splash.style.display = 'none';
                    }, 300);
                }
            }, 800);
        });
    </script>

    <div class="login-wrapper">
        <div class="login-card text-center">
            <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 1.25rem;">
                <img src="LogoIcon.png" alt="Marian College Logo" style="height: 80px; max-width: 100%; object-fit: contain;">
            </div>
            <h2 style="color: #0B1F3A; font-size: 1.4rem; font-weight: 800; margin-bottom: 0.25rem;">Placement Cell Portal</h2>
            <p class="text-muted mb-4" style="font-size: 0.85rem;">Marian College Kuttikkanam (Autonomous)</p>

            <div class="login-tabs">
                <button type="button" class="login-tab active" data-role="student">Student</button>
                <button type="button" class="login-tab" data-role="teacher">Teacher</button>
                <button type="button" class="login-tab" data-role="admin">Admin</button>
            </div>

            <div id="loginAlert" class="alert hidden"></div>

            <form id="loginForm" style="text-align: left;">
                <input type="hidden" id="role" value="student">
                <div class="form-group">
                    <label for="username" class="form-label" style="font-weight: 700;">Register Number</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter Register Number" required>
                </div>
                <div class="form-group" style="position: relative;">
                    <label for="password" class="form-label" style="font-weight: 700;">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter Password" style="padding-right: 40px;" required>
                    <button type="button" id="togglePasswordBtn" style="position: absolute; right: 10px; top: 32px; background: none; border: none; cursor: pointer; color: #64748b; padding: 0; outline: none;" title="Show Password">
                        <svg id="eyeIcon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </button>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-3" style="font-size: 0.95rem; font-weight: 700;">Login to Portal</button>
            </form>

            <div style="border-top: 1px solid #E2E8F0; padding-top: 1.25rem; margin-top: 1.75rem; text-align: center;">
                <span class="text-muted" style="font-size: 11px; font-weight: 600;">Marian College Kuttikkanam Placement Cell</span>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/db.js?v=5"></script>
    <script src="js/auth.js?v=5"></script>
</body>
</html>
