<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Marian College Kuttikkanam Placement Cell</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=8">
</head>
<body class="premium-ui">
    <!-- Splash Screen -->
    <div id="splash-screen">
        <img src="beintrack_logo.png" alt="BE IN TRACK Logo">
        <h1>BE IN TRACK</h1>
        <p>@powered by The Strategist</p>
    </div>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            setTimeout(function() {
                var splash = document.getElementById('splash-screen');
                if (splash) {
                    splash.classList.add('hidden');
                    setTimeout(function() {
                        splash.style.display = 'none';
                    }, 300);
                }
            }, 1000);
        });
    </script>
    <div class="login-wrapper">
        <div class="glass-card login-card text-center">
            <div style="display: flex; align-items: center; justify-content: center; margin-bottom: 1.5rem;">
                <img src="LogoIcon.png" alt="College Logo" style="height: 75px; max-width: 100%; object-fit: contain;">
            </div>
            <h2>Placement Cell</h2>
            <p class="text-muted mb-4">Marian College Kuttikkanam Placement Management</p>

            <div class="login-tabs">
                <button type="button" class="login-tab active" data-role="student">Student</button>
                <button type="button" class="login-tab" data-role="teacher">Teacher</button>
                <button type="button" class="login-tab" data-role="admin">Admin</button>
            </div>

            <div id="loginAlert" class="alert hidden"></div>

            <form id="loginForm">
                <input type="hidden" id="role" value="student">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Admin / Reg No / Phone No" required>
                </div>
                <div class="form-group" style="position: relative;">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter Password" style="padding-right: 40px;" required>
                    <button type="button" id="togglePasswordBtn" style="position: absolute; right: 10px; top: 35px; background: none; border: none; cursor: pointer; color: #64748b; padding: 0; outline: none;" title="Show Password">
                        <svg id="eyeIcon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
                            <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        </svg>
                    </button>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-2">Login</button>
            </form>

            <!-- Powered by KVJ Analytics -->
            <div class="powered-by mt-4 d-flex align-items-center justify-content-center gap-2" style="border-top: 1px solid #f1f5f9; padding-top: 1.25rem; margin-top: 1.5rem;">
                <img src="KVJ analytics Logo.png" alt="KVJ Analytics Logo" style="height: 18px; object-fit: contain;">
                <span class="text-muted" style="font-size: 11px; font-weight: 500; letter-spacing: 0.2px; color: #64748b;">Powered by KVJ Analytics</span>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <!-- Supabase CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js?v=4"></script>
</body>
</html>
